# This is a basic workflow to help you get started with Actions

name: CICD

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  REPO: conduit

permissions:
  contents: read
  packages: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
#------------------------------------------------------------------------#
#                   Build and publich backend image on GHCR
#------------------------------------------------------------------------#

  build_and_publish_backend:
    runs-on: ubuntu-latest
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      # Using Personal AccessToken (PAT), logs into the GIT Hub Container Repository (GHCR)
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Set repository owner name to lowercase for GHCR
      - name: Set lowercase image name
        id: imageName
        run: echo "name=${{ env.REGISTRY }}/${GITHUB_REPOSITORY_OWNER,,}/${{ env.REPO }}-backend:latest" >> "$GITHUB_OUTPUT"
      
      - name: Build and push Docker backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/${{ env.REPO }}-backend
          file: ./backend/${{ env.REPO }}-backend/Dockerfile
          push: true
          tags: ${{ steps.imageName.outputs.name }}

  #------------------------------------------------------------------------#
  #                   Build and publich frontend image on GHCR
  #------------------------------------------------------------------------#
  build_and_publish_frontend:
      runs-on: ubuntu-latest
      # this build requires the previous image to be handled first
      needs: build_and_publish_backend
      steps:
        # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
        - name: Checkout repository
          uses: actions/checkout@v4

        # Using Personal AccessToken (PAT), logs into the GIT Hub Container Repository (GHCR)
        - name: Log in to the Container registry
          uses: docker/login-action@v3
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        # Set repository owner name to lowercase for GHCR
        - name: Set lowercase image name
          id: imageName
          run: echo "name=${{ env.REGISTRY }}/${GITHUB_REPOSITORY_OWNER,,}/${{ env.REPO }}-frontend:latest" >> "$GITHUB_OUTPUT"

        - name: Build and push Docker frontend image
          uses: docker/build-push-action@v6
          with:
            context: ./frontend/${{ env.REPO }}-frontend
            file: ./frontend/${{ env.REPO }}-frontend/Dockerfile
            push: true
            tags: ${{ steps.imageName.outputs.name }}


 