# This is a basic workflow to help you get started with Actions

name: CICD

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  REPO: conduit

# permissions granted to this workflow for the Repo
permissions:
  contents: read
  packages: write
  id-token: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
#------------------------------------------------------------------------#
#                   Build and publish backend image on GHCR
#------------------------------------------------------------------------#

  build_and_publish_backend:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.imageName.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      # Sets a dedicated builder to allow for the use of SBOM and provenance and keeps the state consistent across steps
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Using the default github token, logs into the GIT Hub Container Repository (GHCR)
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Set repository owner name to lowercase for GHCR and set immutable tags for signed images
      - name: Set lowercase image name and immutable tags
        id: imageName
        run: |
          IMAGE="${{ env.REGISTRY }}/${GITHUB_REPOSITORY_OWNER,,}/${{ env.REPO }}-backend"
          SHA_SHORT="${GITHUB_SHA::7}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:latest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:sha-$SHA_SHORT" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      
      - name: Build Docker backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend/${{ env.REPO }}-backend
          file: ./backend/${{ env.REPO }}-backend/Dockerfile
          load: true
          push: false
          tags: ${{ steps.imageName.outputs.tags }}
          provenance: true
          sbom: true

      ############Disabled because current backend Repo has security vulnerabilities that are outside of the scope for this project ############
      ############ Left in as an example of how to use Trivy to scan an image before pushing to a Repo ########################
      # Scan image for safety before pushing to Repo
      # - name: Scan backend image with Trivy
      #  uses: aquasecurity/trivy-action@v0.36.0
      #  with:
      #    image-ref: ${{ steps.imageName.outputs.image }}:${{ github.sha }}
      #    format: table
      #    severity: HIGH,CRITICAL
      #    exit-code: '1'
      #    ignore-unfixed: true
      #########################################################################################################

      # On passed scan, push to repo
      - name: Push backend image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./backend/${{ env.REPO }}-backend
          file: ./backend/${{ env.REPO }}-backend/Dockerfile
          push: true
          tags: ${{ steps.imageName.outputs.tags }}
          provenance: true
          sbom: true

      # Setup signed image
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      
      # Sign image by digest
      - name: Sign backend image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${{ steps.imageName.outputs.image }}@${DIGEST}"
        
  #------------------------------------------------------------------------#
  #                   Build and publish frontend image on GHCR
  #------------------------------------------------------------------------#
  build_and_publish_frontend:
      runs-on: ubuntu-latest
      # this build requires the previous image to be handled first
      needs: build_and_publish_backend
      outputs:
        image: ${{ steps.imageName.outputs.image }}
        digest: ${{ steps.push.outputs.digest }}
      steps:
        # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
        - name: Checkout repository
          uses: actions/checkout@v4

        # Sets a dedicated builder to allow for the use of SBOM and provenance and keeps the state consistent across steps
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        # Using the default github token, logs into the GIT Hub Container Repository (GHCR)
        - name: Log in to the Container registry
          uses: docker/login-action@v3
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        # Set repository owner name to lowercase for GHCR and set immutable tags for signed images
        - name: Set lowercase image name and immutable tags
          id: imageName
          run: |
            IMAGE="${{ env.REGISTRY }}/${GITHUB_REPOSITORY_OWNER,,}/${{ env.REPO }}-frontend"
            SHA_SHORT="${GITHUB_SHA::7}"
            echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
            echo "tags<<EOF" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:latest" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:sha-$SHA_SHORT" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"


        - name: Build and push Docker frontend image
          id: push
          uses: docker/build-push-action@v6
          with:
            context: ./frontend/${{ env.REPO }}-frontend
            file: ./frontend/${{ env.REPO }}-frontend/Dockerfile
            push: true
            tags: ${{ steps.imageName.outputs.tags }}
            provenance: true
            sbom: true

        # Setup signed image
        - name: Install cosign
          uses: sigstore/cosign-installer@v3
        
        # Sign image by digest
        - name: Sign frontend image
          env:
            DIGEST: ${{ steps.push.outputs.digest }}
          run: |
            cosign sign --yes "${{ steps.imageName.outputs.image }}@${DIGEST}"
        
  #------------------------------------------------------------------------#
  #                   Remotely Deploy over SSH with DockerCompose
  #------------------------------------------------------------------------#

  deploy_on_VM:
    runs-on: ubuntu-latest
    needs: [build_and_publish_backend, build_and_publish_frontend]
    environment: production

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Copy Compose file to VM
      uses: appleboy/scp-action@v0.1.7
      with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VM_SSH_PORT }}
          source: "docker-compose.yaml"
          target: "~/conduit-deployment"
          overwrite: true

    - name: Deploy over SSH
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.VM_IP }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.VM_SSH_PORT }}
        script_stop: true
       script: |
            set -euo pipefail
            cd ~/conduit-deployment

            printf '%s\n' "${{ secrets.ENV_FILE }}" > .env
            set -a; . ./.env; set +a

            export BACKEND_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/conduit-backend:${GITHUB_SHA}"
            export FRONTEND_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/conduit-frontend:${GITHUB_SHA}"

            docker compose pull
            docker compose up -d --remove-orphans

             for i in $(seq 1 30); do
              if curl -fsS -o /dev/null "http://localhost:${FRONTEND_PORT}/api/articles/"; then
                echo "Deployment healthy."
                exit 0
              fi
              sleep 5
            done

            docker compose logs --tail=100
            exit 1