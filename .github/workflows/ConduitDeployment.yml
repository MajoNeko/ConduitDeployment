# This is a basic workflow to help you get started with Actions

name: CICD

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  REPO: conduit

# permissions granted to this workflow for the Repo
permissions:
  contents: read
  packages: write
  id-token: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
#------------------------------------------------------------------------#
#                   Build and publish backend image on GHCR
#------------------------------------------------------------------------#

  build_and_publish_backend:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.imageName.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      # Sets a dedicated builder to allow for the use of SBOM and provenance and keeps the state consistent across steps
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Using Personal AccessToken (PAT), logs into the GIT Hub Container Repository (GHCR)
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Set repository owner name to lowercase for GHCR and set immutable tags for signed images
      - name: Set lowercase image name and immutable tags
        id: imageName
        run: |
          IMAGE="${{ env.REGISTRY }}/${GITHUB_REPOSITORY_OWNER,,}/${{ env.REPO }}-backend"
          SHA_SHORT="${GITHUB_SHA::7}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:latest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:sha-$SHA_SHORT" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      
      - name: Build Docker backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend/${{ env.REPO }}-backend
          file: ./backend/${{ env.REPO }}-backend/Dockerfile
          push: false
          tags: ${{ steps.imageName.outputs.tags }}
          provenance: true
          sbom: true

      # Scan image for safety before pushing to Repo
      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.imageName.outputs.image }}:sha-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      # On passed scan, push to repo
      - name: Push backend image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./backend/${{ env.REPO }}-backend
          file: ./backend/${{ env.REPO }}-backend/Dockerfile
          push: true
          tags: ${{ steps.imageName.outputs.tags }}
          provenance: true
          sbom: true

      # Setup signed image
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      
      - name: Sign backend image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes \ "${{ steps.imageName.outputs.image }}@${DIGEST}"
        
  #------------------------------------------------------------------------#
  #                   Build and publish frontend image on GHCR
  #------------------------------------------------------------------------#
  build_and_publish_frontend:
      runs-on: ubuntu-latest
      # this build requires the previous image to be handled first
      needs: build_and_publish_backend
      steps:
        # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
        - name: Checkout repository
          uses: actions/checkout@v4

        # Using Personal AccessToken (PAT), logs into the GIT Hub Container Repository (GHCR)
        - name: Log in to the Container registry
          uses: docker/login-action@v3
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        # Set repository owner name to lowercase for GHCR
        - name: Set lowercase image name
          id: imageName
          run: echo "name=${{ env.REGISTRY }}/${GITHUB_REPOSITORY_OWNER,,}/${{ env.REPO }}-frontend:latest" >> "$GITHUB_OUTPUT"

        - name: Build and push Docker frontend image
          uses: docker/build-push-action@v6
          with:
            context: ./frontend/${{ env.REPO }}-frontend
            file: ./frontend/${{ env.REPO }}-frontend/Dockerfile
            push: true
            tags: ${{ steps.imageName.outputs.name }}
            provenance: true
            sbom: true
        
  #------------------------------------------------------------------------#
  #                   Build and publich frontend image on GHCR
  #------------------------------------------------------------------------#

 